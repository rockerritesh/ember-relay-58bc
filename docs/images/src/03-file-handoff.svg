  <text x="1580" y="1168" text-anchor="middle" font-family="Menlo, monospace" font-size="28" fill="#E8933A" font-weight="700">6 &#183; fetch_payload &#8594; 260 KB, sha256 verified</text>
  <text x="110" y="1315" text-anchor="start" font-family="Menlo, monospace" font-size="30" fill="#E5766E" font-weight="700">they reject instead? the file never leaves your machine.</text>
